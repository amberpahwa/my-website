<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            color: #bbb;
            margin-bottom: 40px;
            font-size: 18px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        a {
            display: block;
            padding: 18px;
            border: 1px solid #555;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            background: white;
            color: black;
            transform: translateY(-3px);
        }

        .back {
            margin-top: 35px;
            border: none;
            color: #aaa;
        }
